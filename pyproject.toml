[project]
name = "orc"
version = "0.2.0"
description = "Task orchestrator for Claude Code: board, queue, git worktrees, merge"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "alimardon" }]
keywords = ["claude-code", "orchestrator", "agents", "task-board", "git-worktree", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
]

[project.urls]
Homepage = "https://github.com/alimardonbegov/orc"
Repository = "https://github.com/alimardonbegov/orc"
Issues = "https://github.com/alimardonbegov/orc/issues"

[project.scripts]
orc = "orc.main:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orc"]

# The built SPA is shipped inside the wheel (orc/_web), see hatch_build.py
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]
